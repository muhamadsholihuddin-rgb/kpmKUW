<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<title>Data KPM Dampingan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --navy-950:#0B1F3A;
  --navy-800:#1E3A5F;
  --navy-700:#2C5079;
  --navy-100:#DCE3ED;
  --navy-50:#F1F4F8;
  --amber-500:#C9702E;
  --amber-100:#F5E1CE;
  --coral-500:#D64545;
  --coral-100:#FBE3E1;
  --ink-900:#201C18;
  --ink-600:#5C5650;
  --ink-400:#8C857D;
  --paper:#F7F5F2;
  --card:#FFFFFF;
  --line:#E6E1DA;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow:0 2px 10px rgba(30,58,95,.08), 0 1px 2px rgba(30,58,95,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink-900);
  overscroll-behavior-y:none;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
button{font-family:inherit;}
.app-header{
  position:sticky; top:0; z-index:20;
  background:var(--navy-800);
  color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 18px 16px;
  border-radius:0 0 22px 22px;
  box-shadow:0 4px 16px rgba(8,48,44,.18);
}
.app-header .eyebrow{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--amber-500); font-weight:700; margin-bottom:2px;
}
.hdr-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.pendamping-badge{
  display:flex; align-items:center; gap:6px; cursor:pointer;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
  border-radius:20px; padding:5px 11px 5px 7px; max-width:56%;
}
.pendamping-badge svg{width:16px; height:16px; stroke:var(--amber-500); fill:none; stroke-width:1.8; flex-shrink:0;}
.pendamping-badge span{
  font-size:11px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.app-header h1{font-size:20px; margin:0; font-weight:700;}
.app-header .sub{font-size:12.5px; color:var(--navy-100); margin-top:3px;}

main{padding:16px; max-width:640px; margin:0 auto;}
.view{display:none;}
.view.active{display:block; animation:fadein .22s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---- Bottom nav ---- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(30,58,95,.08);
}
.nav-btn{
  flex:1; border:none; background:none; padding:9px 2px 8px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-400); font-size:10.5px; font-weight:600;
  cursor:pointer;
}
.nav-btn svg{width:22px; height:22px; stroke:var(--ink-400); fill:none; stroke-width:1.8;}
.nav-btn.active{color:var(--navy-800);}
.nav-btn.active svg{stroke:var(--navy-800);}
.nav-btn .dot{width:4px; height:4px; border-radius:50%; background:transparent; margin-top:-2px;}
.nav-btn.active .dot{background:var(--amber-500);}

/* ---- Cards & generic ---- */
.card{
  background:var(--card); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
  border:1px solid var(--line);
}
.section-title{
  font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--navy-800); margin:20px 2px 10px;
}
.section-title:first-child{margin-top:2px;}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-card{
  background:linear-gradient(160deg,var(--navy-700),var(--navy-800));
  color:#fff; border-radius:var(--radius-md); padding:14px;
  position:relative; overflow:hidden;
}
.stat-card.gold{background:linear-gradient(160deg,#F7B94A,var(--amber-500));}
.stat-card .stat-num{font-family:'Poppins',sans-serif; font-size:26px; font-weight:800; line-height:1;}
.stat-card .stat-label{font-size:11.5px; opacity:.9; margin-top:5px; font-weight:600;}
.stat-card svg{position:absolute; right:-6px; top:-6px; width:56px; height:56px; opacity:.18; stroke:#fff; fill:none; stroke-width:1.5;}

.desa-list{display:flex; flex-direction:column; gap:8px;}
.desa-row{
  display:flex; align-items:center; gap:10px;
  background:var(--navy-50); border-radius:var(--radius-sm); padding:10px 12px;
}
.desa-row .chip-num{
  width:30px; height:30px; border-radius:9px; background:var(--navy-800); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.desa-row .name{flex:1; font-weight:600; font-size:13.5px;}
.desa-row .bar-track{flex:2; height:7px; background:#fff; border-radius:6px; overflow:hidden;}
.desa-row .bar-fill{height:100%; background:var(--amber-500); border-radius:6px;}
.desa-row .count{font-weight:700; font-size:13px; color:var(--navy-800); width:26px; text-align:right;}
.status-icon-row{cursor:pointer; transition:transform .12s ease;}
.status-icon-row:active{transform:scale(.98);}
.status-icon-row .chip-num.status-chip{background:var(--navy-800); padding:6px;}
.status-icon-row .chip-num.status-chip svg{width:100%; height:100%; stroke:#fff; fill:none; stroke-width:1.8;}
.status-icon-row .count{font-family:'Poppins',sans-serif; font-weight:800; font-size:16px; width:auto; color:var(--navy-800);}

.komp-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.komp-cell{
  background:var(--navy-50); border-radius:var(--radius-sm); padding:10px 4px; text-align:center;
}
.komp-cell .n{font-family:'Poppins',sans-serif; font-weight:800; font-size:19px; color:var(--navy-800);}
.komp-cell .l{font-size:10px; color:var(--ink-600); font-weight:600; margin-top:2px;}
.komp-icon-cell{padding:12px 4px 10px;}
.komp-icon{width:26px; height:26px; margin:0 auto 6px; color:var(--amber-500);}
.komp-icon svg{width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.8;}
.komp-clickable{cursor:pointer; transition:transform .12s ease, background .12s ease;}
.komp-clickable:active{transform:scale(.95); background:var(--navy-100);}

/* ---- Foto slot ---- */
.photo-slot{
  background:var(--navy-50); border-radius:var(--radius-sm); overflow:hidden;
  aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;
  margin-bottom:8px; border:1.5px dashed var(--line);
}
.photo-slot img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-empty{font-size:12px; color:var(--ink-400); text-align:center; padding:10px;}

/* ---- Form controls ---- */
label{font-size:12px; font-weight:600; color:var(--ink-600); display:block; margin:0 0 5px 2px;}
select, input[type=text], input[type=date], input[type=password]{
  width:100%; padding:11px 12px; border-radius:var(--radius-sm);
  border:1.5px solid var(--line); background:#fff; font-size:14px; color:var(--ink-900);
  font-family:'Inter',sans-serif;
}
select:focus, input:focus{outline:none; border-color:var(--navy-700);}
.field{margin-bottom:12px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--navy-800); color:#fff; border:none; border-radius:var(--radius-sm);
  padding:12px 16px; font-weight:700; font-size:13.5px; cursor:pointer; width:100%;
}
.btn.secondary{background:var(--navy-50); color:var(--navy-800); border:1.5px solid var(--navy-100);}
.btn.gold{background:var(--amber-500); color:#fff;}
.btn.danger{background:var(--coral-100); color:var(--coral-500); border:1.5px solid var(--coral-100);}
.btn.ghost{background:none; color:var(--navy-800); border:1.5px solid var(--line); width:auto; padding:9px 14px;}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2;}
.btn-row{display:flex; gap:8px; margin-top:4px;}
.btn-row .btn{width:auto; flex:1;}

/* ---- Table ---- */
.table-wrap{overflow-x:auto; border-radius:var(--radius-md); border:1px solid var(--line);}
table{width:100%; border-collapse:collapse; font-size:12.5px; background:#fff;}
th{
  background:var(--navy-800); color:#fff; text-align:left; padding:9px 10px;
  font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
}
td{padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:nth-child(even) td{background:var(--navy-50);}
.badge{
  display:inline-block; padding:3px 8px; border-radius:20px; font-size:10.5px; font-weight:700;
}
.badge.aktif{background:var(--navy-100); color:var(--navy-800);}
.badge.nonaktif{background:#EDEDED; color:var(--ink-400);}
.edit-icon-btn{
  background:var(--amber-100); border:none; border-radius:8px; width:30px; height:30px;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
}
.edit-icon-btn svg{width:15px; height:15px; stroke:var(--amber-500); fill:none; stroke-width:2;}
.row-actions{display:flex; align-items:center; gap:4px;}
.icon-btn-sm{
  background:var(--navy-50); border:none; border-radius:8px; width:26px; height:26px;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
}
.icon-btn-sm svg{width:13px; height:13px; stroke:var(--navy-700); fill:none; stroke-width:2;}
.icon-btn-sm:active{background:var(--navy-100);}
.kpm-name-link{color:var(--navy-800); cursor:pointer; text-decoration:underline; text-decoration-color:var(--navy-100); text-underline-offset:2px;}
.empty-state{text-align:center; padding:34px 16px; color:var(--ink-400);}
.empty-state svg{width:40px; height:40px; stroke:var(--ink-400); fill:none; stroke-width:1.4; margin-bottom:8px;}
.empty-state p{font-size:13px; margin:0;}

/* ---- Status list ---- */
.status-card{
  background:#fff; border-radius:var(--radius-md); padding:12px 14px; margin-bottom:8px;
  border:1px solid var(--line); border-left:4px solid var(--amber-500);
}
.status-card .nm{font-weight:700; font-size:14px;}
.status-card .meta{font-size:11.5px; color:var(--ink-400); margin-top:2px;}
.status-card .catatan{font-size:12px; color:var(--ink-600); margin-top:6px; background:var(--navy-50); padding:6px 9px; border-radius:8px;}

/* ---- Modal ---- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(8,48,44,.45); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:#fff; width:100%; max-width:640px; border-radius:22px 22px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h3{margin:0; font-size:16px;}
.modal-close{background:var(--navy-50); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.modal-close svg{width:15px; height:15px; stroke:var(--navy-800); stroke-width:2.4;}

/* ---- Toast ---- */
.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
  background:var(--ink-900); color:#fff; padding:11px 18px; border-radius:30px;
  font-size:13px; font-weight:600; z-index:60; opacity:0; transition:all .25s ease; pointer-events:none;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---- Absensi print layout (hidden, used only for PDF export) ---- */
#print-area{position:fixed; left:-9999px; top:0;}

.sticky-actions{
  position:fixed; left:0; right:0;
  bottom:calc(64px + env(safe-area-inset-bottom));
  z-index:25; display:flex; gap:8px;
  padding:10px 16px; max-width:640px; margin:0 auto;
  background:linear-gradient(to top, var(--paper) 65%, transparent);
}
.sticky-actions .btn{flex:1; box-shadow:0 4px 14px rgba(30,58,95,.2);}
.sticky-actions #share-absensi-pdf{flex:0 0 48px; padding:12px 0;}
.sticky-actions #share-absensi-pdf svg{width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2;}
.hint{font-size:11.5px; color:var(--ink-400); margin-top:6px; line-height:1.5;}
.settings-card .row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line);}
.settings-card .row:last-child{border-bottom:none;}
.settings-card .row .k{font-size:13px; color:var(--ink-600);}
.settings-card .row .v{font-size:13px; font-weight:700;}
input[type=file]{display:none;}

/* ---- Install Banner ---- */
.install-banner{
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:linear-gradient(135deg, var(--navy-800), var(--navy-700));
  color:#fff; padding:16px 16px calc(16px + env(safe-area-inset-top));
  display:none; align-items:center; gap:16px;
  box-shadow:0 4px 16px rgba(30,58,95,.25);
  animation:slidedown .3s ease;
}
.install-banner.show{display:flex;}
@keyframes slidedown{from{transform:translateY(-100%); opacity:0;} to{transform:translateY(0); opacity:1;}}
.install-banner-content{
  flex:1; max-width:640px; margin:0 auto; width:100%;
  display:flex; align-items:center; gap:14px; justify-content:space-between;
}
.install-banner-text{flex:1;}
.install-banner-title{font-weight:700; font-size:15px; margin-bottom:2px;}
.install-banner-desc{font-size:12.5px; opacity:.9; line-height:1.3;}
.install-banner-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
.btn-install{
  background:#fff; color:var(--navy-800); border:none;
  padding:8px 16px; border-radius:8px; font-weight:700; font-size:12.5px;
  cursor:pointer; white-space:nowrap; transition:all .2s ease;
}
.btn-install:active{transform:scale(.96);}
.btn-dismiss{
  background:rgba(255,255,255,.2); color:#fff; border:1px solid rgba(255,255,255,.3);
  padding:8px 14px; border-radius:8px; font-weight:600; font-size:12.5px;
  cursor:pointer; white-space:nowrap; transition:all .2s ease;
}
.btn-dismiss:active{transform:scale(.96);}

/* Push main content down when banner is visible */
body.install-banner-active{
  padding-top:80px;
}
body.install-banner-active .app-header{
  margin-top:80px;
}

/* ---- Import Gabungan Wizard ---- */
.ig-progress{display:flex; align-items:center; gap:4px; margin-bottom:14px;}
.ig-pstep{flex:1; height:4px; border-radius:3px; background:var(--line);}
.ig-pstep.done{background:var(--navy-700);}
.ig-pstep.now{background:var(--amber-500);}
.ig-dropzone{
  border:1.5px dashed #c3cbc7; border-radius:var(--radius-sm); padding:18px 12px;
  text-align:center; background:var(--navy-50); margin-bottom:10px; cursor:pointer;
}
.ig-dz-text{font-size:12.5px;font-weight:600;color:var(--ink-900);}
.ig-dz-sub{font-size:11px;color:var(--ink-400);margin-top:2px;}
.ig-filelist{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.ig-filerow{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--navy-50); border:1px solid var(--navy-100); border-radius:8px;
  padding:8px 10px; font-size:11.5px;
}
.ig-filerow .fname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.ig-filerow .frows{color:var(--ink-400);font-size:10.5px;flex-shrink:0;margin:0 8px;}
.ig-filerow .frm{background:none;border:none;color:var(--coral-500);font-weight:700;cursor:pointer;font-size:13px;flex-shrink:0;}
.ig-stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
.ig-stat-card{border-radius:var(--radius-sm); padding:10px 6px; text-align:center;}
.ig-stat-card.ok{background:var(--navy-50);}
.ig-stat-card.warn{background:var(--amber-100);}
.ig-stat-card.skip{background:#EDEDED;}
.ig-stat-card .n{font-family:'Poppins',sans-serif; font-weight:800; font-size:19px;}
.ig-stat-card.ok .n{color:var(--navy-800);}
.ig-stat-card.warn .n{color:#9c6c0a;}
.ig-stat-card.skip .n{color:var(--ink-400);}
.ig-stat-card .l{font-size:9px; color:var(--ink-600); font-weight:600; margin-top:2px; line-height:1.3;}
.ig-section-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--navy-800); margin:14px 2px 8px; display:flex; align-items:center; gap:6px;}
.ig-section-title.warn{color:#9c6c0a;}
.ig-pill{background:var(--navy-800); color:#fff; border-radius:20px; padding:1px 8px; font-size:10px; font-weight:700;}
.ig-section-title.warn .ig-pill{background:var(--amber-500);}
.ig-row{
  display:flex; align-items:center; gap:9px; background:#fff; border:1px solid var(--line);
  border-radius:10px; padding:8px 10px; margin-bottom:6px;
}
.ig-row.warn{border-left:3px solid var(--amber-500); background:var(--amber-100);}
.ig-row.ok{border-left:3px solid var(--navy-700);}
.ig-avatar{
  width:28px;height:28px;border-radius:8px;background:var(--navy-100);color:var(--navy-800);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;
}
.ig-row.warn .ig-avatar{background:var(--amber-500); color:#fff;}
.ig-row-info{flex:1; min-width:0;}
.ig-row-info .nm{font-weight:700; font-size:12px;}
.ig-row-info .meta{font-size:10.5px; color:var(--ink-400); margin-top:1px;}
.ig-row-info .meta.warn-txt{color:#9c6c0a; font-weight:600;}
.ig-more{text-align:center; font-size:11px; color:var(--ink-400); padding:4px 0 2px;}
.badge-lengkapi{
  display:inline-flex; align-items:center; gap:3px;
  background:var(--amber-100); color:#9c6c0a; font-size:9px; font-weight:700;
  padding:2px 6px; border-radius:20px; margin-left:6px; vertical-align:middle;
}
.step-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--navy-800); margin-bottom:4px;}
.step-title{font-size:14px; font-weight:700; margin:0 0 4px;}
</style>
</head>
<body>

<header class="app-header">
  <div class="hdr-top">
    <div class="eyebrow" id="hdr-eyebrow">PKH · Kab. Kediri</div>
    <div class="pendamping-badge" id="pendamping-badge">
      <svg viewBox="0 0 24 24"><path d="M12 15c3.3 0 6 1.6 6 4v1H6v-1c0-2.4 2.7-4 6-4z"/><circle cx="12" cy="8" r="3.6"/><path d="M4.5 6.5l1.2 1.6M19.5 6.5l-1.2 1.6" stroke-linecap="round"/></svg>
      <span id="pendamping-name">Atur Profil</span>
    </div>
  </div>
  <h1 id="hdr-title">Beranda</h1>
  <div class="sub" id="hdr-sub">Ringkasan data KPM dampingan</div>
</header>

<main id="main"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="beranda">
    <svg viewBox="0 0 24 24"><path d="M4 11L12 4l8 7M6 10v9h12v-9"/></svg>
    Beranda<span class="dot"></span>
  </button>
  <button class="nav-btn" data-view="data">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
    Data KPM<span class="dot"></span>
  </button>
  <button class="nav-btn" data-view="status">
