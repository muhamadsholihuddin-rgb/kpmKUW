<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5D52">
<title>Data KPM Dampingan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --teal-950:#08302C;
  --teal-800:#0B5D52;
  --teal-700:#0E6E62;
  --teal-100:#DCEDE8;
  --teal-50:#F0F7F5;
  --gold-500:#F5A623;
  --gold-100:#FDEDD1;
  --coral-500:#E85D4C;
  --coral-100:#FBE2DE;
  --ink-900:#16221F;
  --ink-600:#4B5C57;
  --ink-400:#7C8D88;
  --paper:#F6F7F5;
  --card:#FFFFFF;
  --line:#E4E9E6;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow:0 2px 10px rgba(11,93,82,.08), 0 1px 2px rgba(11,93,82,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink-900);
  overscroll-behavior-y:none;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
button{font-family:inherit;}
.app-header{
  position:sticky; top:0; z-index:20;
  background:var(--teal-800);
  color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 18px 16px;
  border-radius:0 0 22px 22px;
  box-shadow:0 4px 16px rgba(8,48,44,.18);
}
.app-header .eyebrow{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold-500); font-weight:700; margin-bottom:2px;
}
.hdr-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.pendamping-badge{
  display:flex; align-items:center; gap:6px; cursor:pointer;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
  border-radius:20px; padding:5px 11px 5px 7px; max-width:56%;
}
.pendamping-badge svg{width:16px; height:16px; stroke:var(--gold-500); fill:none; stroke-width:1.8; flex-shrink:0;}
.pendamping-badge span{
  font-size:11px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.app-header h1{font-size:20px; margin:0; font-weight:700;}
.app-header .sub{font-size:12.5px; color:var(--teal-100); margin-top:3px;}

main{padding:16px; max-width:640px; margin:0 auto;}
.view{display:none;}
.view.active{display:block; animation:fadein .22s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---- Bottom nav ---- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(11,93,82,.08);
}
.nav-btn{
  flex:1; border:none; background:none; padding:9px 2px 8px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-400); font-size:10.5px; font-weight:600;
  cursor:pointer;
}
.nav-btn svg{width:22px; height:22px; stroke:var(--ink-400); fill:none; stroke-width:1.8;}
.nav-btn.active{color:var(--teal-800);}
.nav-btn.active svg{stroke:var(--teal-800);}
.nav-btn .dot{width:4px; height:4px; border-radius:50%; background:transparent; margin-top:-2px;}
.nav-btn.active .dot{background:var(--gold-500);}

/* ---- Cards & generic ---- */
.card{
  background:var(--card); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
  border:1px solid var(--line);
}
.section-title{
  font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--teal-800); margin:20px 2px 10px;
}
.section-title:first-child{margin-top:2px;}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-card{
  background:linear-gradient(160deg,var(--teal-700),var(--teal-800));
  color:#fff; border-radius:var(--radius-md); padding:14px;
  position:relative; overflow:hidden;
}
.stat-card.gold{background:linear-gradient(160deg,#F7B94A,var(--gold-500));}
.stat-card .stat-num{font-family:'Poppins',sans-serif; font-size:26px; font-weight:800; line-height:1;}
.stat-card .stat-label{font-size:11.5px; opacity:.9; margin-top:5px; font-weight:600;}
.stat-card svg{position:absolute; right:-6px; top:-6px; width:56px; height:56px; opacity:.18; stroke:#fff; fill:none; stroke-width:1.5;}

.desa-list{display:flex; flex-direction:column; gap:8px;}
.desa-row{
  display:flex; align-items:center; gap:10px;
  background:var(--teal-50); border-radius:var(--radius-sm); padding:10px 12px;
}
.desa-row .chip-num{
  width:30px; height:30px; border-radius:9px; background:var(--teal-800); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.desa-row .name{flex:1; font-weight:600; font-size:13.5px;}
.desa-row .bar-track{flex:2; height:7px; background:#fff; border-radius:6px; overflow:hidden;}
.desa-row .bar-fill{height:100%; background:var(--gold-500); border-radius:6px;}
.desa-row .count{font-weight:700; font-size:13px; color:var(--teal-800); width:26px; text-align:right;}
.status-icon-row{cursor:pointer; transition:transform .12s ease;}
.status-icon-row:active{transform:scale(.98);}
.status-icon-row .chip-num.status-chip{background:var(--teal-800); padding:6px;}
.status-icon-row .chip-num.status-chip svg{width:100%; height:100%; stroke:#fff; fill:none; stroke-width:1.8;}
.status-icon-row .count{font-family:'Poppins',sans-serif; font-weight:800; font-size:16px; width:auto; color:var(--teal-800);}

.komp-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.komp-cell{
  background:var(--teal-50); border-radius:var(--radius-sm); padding:10px 4px; text-align:center;
}
.komp-cell .n{font-family:'Poppins',sans-serif; font-weight:800; font-size:19px; color:var(--teal-800);}
.komp-cell .l{font-size:10px; color:var(--ink-600); font-weight:600; margin-top:2px;}
.komp-icon-cell{padding:12px 4px 10px;}
.komp-icon{width:26px; height:26px; margin:0 auto 6px; color:var(--gold-500);}
.komp-icon svg{width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.8;}
.komp-clickable{cursor:pointer; transition:transform .12s ease, background .12s ease;}
.komp-clickable:active{transform:scale(.95); background:var(--teal-100);}

/* ---- Form controls ---- */
label{font-size:12px; font-weight:600; color:var(--ink-600); display:block; margin:0 0 5px 2px;}
select, input[type=text], input[type=date], input[type=password]{
  width:100%; padding:11px 12px; border-radius:var(--radius-sm);
  border:1.5px solid var(--line); background:#fff; font-size:14px; color:var(--ink-900);
  font-family:'Inter',sans-serif;
}
select:focus, input:focus{outline:none; border-color:var(--teal-700);}
.field{margin-bottom:12px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--teal-800); color:#fff; border:none; border-radius:var(--radius-sm);
  padding:12px 16px; font-weight:700; font-size:13.5px; cursor:pointer; width:100%;
}
.btn.secondary{background:var(--teal-50); color:var(--teal-800); border:1.5px solid var(--teal-100);}
.btn.gold{background:var(--gold-500); color:#fff;}
.btn.danger{background:var(--coral-100); color:var(--coral-500); border:1.5px solid var(--coral-100);}
.btn.ghost{background:none; color:var(--teal-800); border:1.5px solid var(--line); width:auto; padding:9px 14px;}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2;}
.btn-row{display:flex; gap:8px; margin-top:4px;}
.btn-row .btn{width:auto; flex:1;}

/* ---- Table ---- */
.table-wrap{overflow-x:auto; border-radius:var(--radius-md); border:1px solid var(--line);}
table{width:100%; border-collapse:collapse; font-size:12.5px; background:#fff;}
th{
  background:var(--teal-800); color:#fff; text-align:left; padding:9px 10px;
  font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
}
td{padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:nth-child(even) td{background:var(--teal-50);}
.badge{
  display:inline-block; padding:3px 8px; border-radius:20px; font-size:10.5px; font-weight:700;
}
.badge.aktif{background:var(--teal-100); color:var(--teal-800);}
.badge.nonaktif{background:#EDEDED; color:var(--ink-400);}
.edit-icon-btn{
  background:var(--gold-100); border:none; border-radius:8px; width:30px; height:30px;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
}
.edit-icon-btn svg{width:15px; height:15px; stroke:var(--gold-500); fill:none; stroke-width:2;}
.kpm-name-link{color:var(--teal-800); cursor:pointer; text-decoration:underline; text-decoration-color:var(--teal-100); text-underline-offset:2px;}
.copy-icon-btn{
  background:none; border:none; padding:2px; margin:0; flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
}
.copy-icon-btn svg{width:12px; height:12px; stroke:var(--teal-700); fill:none; stroke-width:2; opacity:.55;}
.copy-icon-btn:active svg{stroke:var(--teal-800);}
.empty-state{text-align:center; padding:34px 16px; color:var(--ink-400);}
.empty-state svg{width:40px; height:40px; stroke:var(--ink-400); fill:none; stroke-width:1.4; margin-bottom:8px;}
.empty-state p{font-size:13px; margin:0;}

/* ---- Status list ---- */
.status-card{
  background:#fff; border-radius:var(--radius-md); padding:12px 14px; margin-bottom:8px;
  border:1px solid var(--line); border-left:4px solid var(--gold-500);
}
.status-card .nm{font-weight:700; font-size:14px;}
.status-card .meta{font-size:11.5px; color:var(--ink-400); margin-top:2px;}
.status-card .catatan{font-size:12px; color:var(--ink-600); margin-top:6px; background:var(--teal-50); padding:6px 9px; border-radius:8px;}

/* ---- Modal ---- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(8,48,44,.45); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:#fff; width:100%; max-width:640px; border-radius:22px 22px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h3{margin:0; font-size:16px;}
.modal-close{background:var(--teal-50); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.modal-close svg{width:15px; height:15px; stroke:var(--teal-800); stroke-width:2.4;}

/* ---- Toast ---- */
.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
  background:var(--ink-900); color:#fff; padding:11px 18px; border-radius:30px;
  font-size:13px; font-weight:600; z-index:60; opacity:0; transition:all .25s ease; pointer-events:none;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---- Absensi print layout (hidden, used only for PDF export) ---- */
#print-area{position:fixed; left:-9999px; top:0;}

.sticky-actions{
  position:fixed; left:0; right:0;
  bottom:calc(64px + env(safe-area-inset-bottom));
  z-index:25; display:flex; gap:8px;
  padding:10px 16px; max-width:640px; margin:0 auto;
  background:linear-gradient(to top, var(--paper) 65%, transparent);
}
.sticky-actions .btn{flex:1; box-shadow:0 4px 14px rgba(11,93,82,.2);}
.sticky-actions #share-absensi-pdf{flex:0 0 48px; padding:12px 0;}
.sticky-actions #share-absensi-pdf svg{width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2;}
.hint{font-size:11.5px; color:var(--ink-400); margin-top:6px; line-height:1.5;}
.settings-card .row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line);}
.settings-card .row:last-child{border-bottom:none;}
.settings-card .row .k{font-size:13px; color:var(--ink-600);}
.settings-card .row .v{font-size:13px; font-weight:700;}
input[type=file]{display:none;}
</style>
</head>
<body>

<header class="app-header">
  <div class="hdr-top">
    <div class="eyebrow" id="hdr-eyebrow">PKH · Kab. Kediri</div>
    <div class="pendamping-badge" id="pendamping-badge">
      <svg viewBox="0 0 24 24"><path d="M12 15c3.3 0 6 1.6 6 4v1H6v-1c0-2.4 2.7-4 6-4z"/><circle cx="12" cy="8" r="3.6"/><path d="M4.5 6.5l1.2 1.6M19.5 6.5l-1.2 1.6" stroke-linecap="round"/></svg>
      <span id="pendamping-name">Atur Profil</span>
    </div>
  </div>
  <h1 id="hdr-title">Beranda</h1>
  <div class="sub" id="hdr-sub">Ringkasan data KPM dampingan</div>
</header>

<main id="main"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="beranda">
    <svg viewBox="0 0 24 24"><path d="M4 11L12 4l8 7M6 10v9h12v-9"/></svg>
    Beranda<span class="dot"></span>
  </button>
  <button class="nav-btn" data-view="data">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
    Data KPM<span class="dot"></span>
  </button>
  <button class="nav-btn" data-view="status">
    <svg viewBox="0 0 24 24"><path d="M12 22s7-5.3 7-11a7 7 0 10-14 0c0 5.7 7 11 7 11z"/><circle cx="12" cy="11" r="2.4"/></svg>
    Status<span class="dot"></span>
  </button>
  <button class="nav-btn" data-view="absensi">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7.5 13.5l2 2 4-4.2"/></svg>
    Absensi<span class="dot"></span>
  </button>
  <button class="nav-btn" data-view="pengaturan">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 01-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 010-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 014 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
    Pengaturan<span class="dot"></span>
  </button>
</nav>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-body"></div>
</div>

<div class="toast" id="toast"></div>
<div id="print-area"></div>

<script src="app.js"></script>
</body>
</html>
